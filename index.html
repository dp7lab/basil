<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Basil</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #ffffff; --fg: #1a1c19; --muted: #5b6157; --accent: #4b7a3c;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #12140f; --fg: #e3e5de; --muted: #a8b0a2; --accent: #9ccb87; }
  }
  body {
    margin: 0; min-height: 100vh; display: grid; place-items: center;
    padding: 40px 20px; background: var(--bg); color: var(--fg);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 460px; text-align: center; }
  h1 { font-size: 34px; margin: 0 0 8px; letter-spacing: -0.02em; }
  p { color: var(--muted); margin: 0 0 28px; }
  a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Basil</h1>
  <p>Nothing hides at the back of the fridge any more.</p>
  <p><a href="privacy.html">Privacy policy</a></p>
</main>
</body>
</html>
